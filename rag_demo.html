<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Intelligence System</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: #0f1117;
  color: #e0e0e0;
  min-height: 100vh;
}
.topbar {
  background: #1a1d27;
  border-bottom: 1px solid #2a2d3a;
  padding: 14px 2rem;
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar h1 { font-size: 16px; font-weight: 500; color: #fff; }
.badge {
  font-size: 11px;
  background: #1e3a5f;
  color: #60a5fa;
  padding: 3px 10px;
  border-radius: 20px;
}
.container {
  max-width: 900px;
  margin: 2rem auto;
  padding: 0 1rem;
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 1.5rem;
}
.card {
  background: #1a1d27;
  border: 1px solid #2a2d3a;
  border-radius: 12px;
  padding: 1.25rem;
}
.card h3 {
  font-size: 13px;
  font-weight: 500;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 1rem;
}
.upload-area {
  border: 2px dashed #2a2d3a;
  border-radius: 10px;
  padding: 2rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 1rem;
}
.upload-area:hover { border-color: #3b82f6; background: #1e2235; }
.upload-area.active { border-color: #3b82f6; background: #1e2235; }
.upload-icon { font-size: 32px; margin-bottom: 8px; }
.upload-text { font-size: 13px; color: #6b7280; }
.upload-text span { color: #3b82f6; }
input[type="file"] { display: none; }
.btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-primary:disabled { background: #1e3a5f; color: #4b6080; cursor: not-allowed; }
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 1rem;
}
.stat {
  background: #0f1117;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
}
.stat-num { font-size: 20px; font-weight: 500; color: #3b82f6; }
.stat-label { font-size: 11px; color: #6b7280; margin-top: 2px; }
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #374151;
  display: inline-block;
  margin-left: 6px;
}
.status-dot.active { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
.chat-area {
  display: flex;
  flex-direction: column;
  height: 600px;
}
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 0;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.msg {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.msg-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.msg.user .msg-icon { background: #1e3a5f; }
.msg.ai .msg-icon { background: #1a2e1a; }
.msg-content {
  background: #0f1117;
  border: 1px solid #2a2d3a;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.6;
  max-width: calc(100% - 50px);
}
.msg.user .msg-content { background: #1e2e4a; border-color: #2a4a6a; }
.msg.ai .msg-content { color: #d1fae5; }
.typing {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 4px 0;
}
.typing span {
  width: 6px; height: 6px;
  background: #6b7280;
  border-radius: 50%;
  animation: bounce 1s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.input-area {
  display: flex;
  gap: 8px;
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid #2a2d3a;
}
input[type="text"] {
  flex: 1;
  background: #0f1117;
  border: 1px solid #2a2d3a;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
  color: #e0e0e0;
  font-family: inherit;
  outline: none;
}
input[type="text"]:focus { border-color: #3b82f6; }
input[type="text"]::placeholder { color: #4b5563; }
.send-btn {
  background: #3b82f6;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  color: #fff;
  cursor: pointer;
  font-size: 16px;
}
.send-btn:hover { background: #2563eb; }
.send-btn:disabled { background: #1e3a5f; cursor: not-allowed; }
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #4b5563;
  gap: 8px;
}
.empty-icon { font-size: 40px; }
.empty-text { font-size: 14px; }
.file-info {
  background: #0f1117;
  border-radius: 8px;
  padding: 10px;
  font-size: 12px;
  color: #6b7280;
  margin-top: 8px;
  display: none;
  word-break: break-all;
}
.file-info.show { display: block; }
.progress {
  height: 3px;
  background: #2a2d3a;
  border-radius: 3px;
  margin-top: 8px;
  overflow: hidden;
  display: none;
}
.progress.show { display: block; }
.progress-bar {
  height: 100%;
  background: #3b82f6;
  width: 0%;
  transition: width 0.3s;
  animation: indeterminate 1.5s infinite;
}
@keyframes indeterminate {
  0% { width: 0%; margin-left: 0; }
  50% { width: 60%; margin-left: 20%; }
  100% { width: 0%; margin-left: 100%; }
}
</style>
</head>
<body>

<div class="topbar">
  <span>🧠</span>
  <h1>PDF Intelligence System</h1>
  <span class="badge">RAG · OpenRouter</span>
  <div style="margin-right: auto;"></div>
  <span style="font-size:12px; color:#6b7280;">
    Status: <span class="status-dot" id="status-dot"></span>
    <span id="status-text">No document loaded</span>
  </span>
</div>

<div class="container">

  <!-- Sidebar -->
  <div>
    <div class="card">
      <h3>📄 Document</h3>
      <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
        <div class="upload-icon">📁</div>
        <div class="upload-text">Drop PDF here or <span>browse</span></div>
      </div>
      <input type="file" id="file-input" accept=".pdf" onchange="handleFile(event)">
      <div class="file-info" id="file-info"></div>
      <div class="progress" id="progress"><div class="progress-bar"></div></div>
      <button class="btn btn-primary" id="upload-btn" onclick="uploadPDF()" disabled>
        Upload & Process
      </button>
      <div class="stats" id="stats" style="display:none;">
        <div class="stat">
          <div class="stat-num" id="stat-chunks">0</div>
          <div class="stat-label">Chunks</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="stat-words">0</div>
          <div class="stat-label">Words</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top: 1rem;">
      <h3>💡 Sample Questions</h3>
      <div style="display:flex; flex-direction:column; gap:6px; margin-top:4px;">
        <button onclick="setQuestion(this.textContent)"
          style="background:#0f1117; border:1px solid #2a2d3a; border-radius:6px; padding:8px 10px; color:#9ca3af; font-size:12px; cursor:pointer; text-align:right; font-family:inherit;">
          Summarize the main topics
        </button>
        <button onclick="setQuestion(this.textContent)"
          style="background:#0f1117; border:1px solid #2a2d3a; border-radius:6px; padding:8px 10px; color:#9ca3af; font-size:12px; cursor:pointer; text-align:right; font-family:inherit;">
          What are the key steps?
        </button>
        <button onclick="setQuestion(this.textContent)"
          style="background:#0f1117; border:1px solid #2a2d3a; border-radius:6px; padding:8px 10px; color:#9ca3af; font-size:12px; cursor:pointer; text-align:right; font-family:inherit;">
          List the most important points
        </button>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div class="card chat-area">
    <h3>💬 Ask Your Document</h3>
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📄</div>
        <div class="empty-text">Upload a PDF to start asking questions</div>
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="question-input"
        placeholder="Ask anything about your document..."
        onkeydown="if(event.key==='Enter') sendQuestion()"
        disabled>
      <button class="send-btn" id="send-btn" onclick="sendQuestion()" disabled>➤</button>
    </div>
  </div>

</div>

<script>
let selectedFile = null;
let pdfLoaded = false;

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  selectedFile = file;

  const area = document.getElementById('upload-area');
  area.classList.add('active');

  const info = document.getElementById('file-info');
  info.textContent = `📄 ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
  info.classList.add('show');

  document.getElementById('upload-btn').disabled = false;
}

// Drag & drop
const area = document.getElementById('upload-area');
area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('active'); });
area.addEventListener('dragleave', () => area.classList.remove('active'));
area.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.pdf')) {
    selectedFile = file;
    const info = document.getElementById('file-info');
    info.textContent = `📄 ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
    info.classList.add('show');
    document.getElementById('upload-btn').disabled = false;
  }
});

async function uploadPDF() {
  if (!selectedFile) return;

  const btn = document.getElementById('upload-btn');
  const progress = document.getElementById('progress');
  btn.disabled = true;
  btn.textContent = 'Processing...';
  progress.classList.add('show');

  const formData = new FormData();
  formData.append('file', selectedFile);

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.error) {
      alert('Error: ' + data.error);
      btn.disabled = false;
      btn.textContent = 'Upload & Process';
      progress.classList.remove('show');
      return;
    }

    // موفق
    pdfLoaded = true;
    document.getElementById('stat-chunks').textContent = data.chunks;
    document.getElementById('stat-words').textContent = (data.words/1000).toFixed(1)+'k';
    document.getElementById('stats').style.display = 'grid';
    document.getElementById('status-dot').classList.add('active');
    document.getElementById('status-text').textContent = data.filename;
    document.getElementById('question-input').disabled = false;
    document.getElementById('send-btn').disabled = false;
    btn.textContent = '✅ Ready';
    progress.classList.remove('show');

    // پیام خوش امد
    document.getElementById('empty-state').remove();
    addMessage('ai', `✅ Document loaded: **${data.filename}**\n${data.chunks} chunks · ${(data.words/1000).toFixed(1)}k words\n\nAsk me anything about this document!`);

  } catch(e) {
    alert('Server error. Make sure rag_server.py is running.');
    btn.disabled = false;
    btn.textContent = 'Upload & Process';
    progress.classList.remove('show');
  }
}

async function sendQuestion() {
  if (!pdfLoaded) return;
  const input = document.getElementById('question-input');
  const question = input.value.trim();
  if (!question) return;

  input.value = '';
  addMessage('user', question);

  const typingId = addTyping();
  document.getElementById('send-btn').disabled = true;

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    removeTyping(typingId);

    if (data.error) {
      addMessage('ai', '❌ Error: ' + data.error);
    } else {
      addMessage('ai', data.answer);
    }
  } catch(e) {
    removeTyping(typingId);
    addMessage('ai', '❌ Could not connect to server.');
  }

  document.getElementById('send-btn').disabled = false;
}

function addMessage(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-icon">${role === 'user' ? '👤' : '🤖'}</div>
    <div class="msg-content">${text.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function addTyping() {
  const msgs = document.getElementById('messages');
  const id = 'typing-' + Date.now();
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = id;
  div.innerHTML = `
    <div class="msg-icon">🤖</div>
    <div class="msg-content"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function setQuestion(text) {
  document.getElementById('question-input').value = text;
  document.getElementById('question-input').focus();
}
</script>
</body>
</html>
